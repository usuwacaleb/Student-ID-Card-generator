<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Generator</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
</head>
<body>

  <div id="login-page">
        <div class="login-box">
            <div class="logo-area">
                <img src="card-bg.png" alt="Veritas Logo" onerror="this.src='https://placeholder.com'">
            </div>
            <h2>Admin Login</h2>
            <input type="email" id="email" placeholder="Enter Email">
            <input type="password" id="password" placeholder="Enter Password">
            <button onclick="login()">Log In</button>
            <button class="secondary-btn" onclick="signup()">Sign Up</button>
            <p id="login-error" class="error-msg"></p>
        </div>
    </div>

    <div id="generator-page" style="display: none;">
        <div class="header">
            <h2>Student ID Generator</h2>
            <button onclick="logout()" class="logout-btn">Log Out</button>
        </div>

        <div class="main-container">
            <!-- Left Side: Form -->
            <div class="form-section">
                <h3>Enter Student Details</h3>
                <label>Full Name</label>
                <input type="text" id="nameInput" placeholder="E.g. caleb usuwa">
                
                <label>Course</label>
                <input type="text" id="courseInput" placeholder="E.g. software engineering">

                <label>Matric Number</label>
                <input type="text" id="matricInput" placeholder="E.g. vug/sen/25/15281">

                <label>Level</label>
                <input type="text" id="levelInput" placeholder="E.g. 200L">

                <label>Upload Photo</label>
                <input type="file" id="photoInput" accept="image/*">

                  <div class="action-section">
                    <h3>Card Controls</h3>
                    <div class="button-group">
                        <button onclick="downloadCardImage()" class="action-btn download-btn">Download Card Image</button>
                        <button onclick="printCard()" class="action-btn print-btn">Print Card</button>
                    </div>
                </div>
            </div>

            <div class="preview-section">
                <h3>Live Preview</h3>
                <div class="id-card" id="id-card">
                    <div class="card-header">
                        <h4>VERITAS UNIVERSITY</h4>
                    </div>
                    <div class="card-body">
                        <img id="cardPhoto" src="https://via.placeholder.com/100" alt="Student Photo">
                        
                        <h2 id="cardName">Student Name</h2>
                        <p class="course" id="cardCourse">Course</p>
                        <p class="level" id="cardLevel">Level</p>
                        <p class="matric" id="cardMatric">Matric Number</p>
                        <div class="id-number">
                            <span>ID No: </span>
                            <strong id="cardIdNumber">STD-0000-0000</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

     <footer class="page-footer">
            <p>For help and inquiries, please visit our <a href="contact page.html" target="_blank">Contact Page</a></p>
        </footer>
    </div>


    <script src="script.js"></script>
    <script src="card utilites.js"></script>
</body>
</html>
